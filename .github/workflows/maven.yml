
name: Java CI with Maven

on:
  push:
    branches: ["master"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Maven 编译
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      # Gradle 编译
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: ankh-invoke-gradle-plugin

      # 上传 Maven 生成的 JAR
      - name: Upload Maven JAR
        uses: actions/upload-artifact@v4
        with:
          name: neigeitems-maven
          path: |
            target/*.jar
          if-no-files-found: error
          retention-days: 14

      # 上传 Gradle 生成的 JAR
      - name: Upload Gradle JAR
        uses: actions/upload-artifact@v4
        with:
          name: ankh-invoke-gradle-plugin
          path: |
            ankh-invoke-gradle-plugin/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
